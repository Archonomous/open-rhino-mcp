name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  plugin:
    name: Rhino 7 plug-in (.rhp)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build
        run: dotnet build plugin/OpenRhinoMcp.csproj -c Release -nologo
      - name: Collect
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item plugin/bin/Release/OpenRhinoMcp.rhp out/
          Copy-Item plugin/bin/Release/Newtonsoft.Json.dll out/
      - uses: actions/upload-artifact@v4
        with:
          name: open-rhino-mcp-plugin
          path: out/

  server:
    name: MCP server + Claude Desktop extension
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run pack:mcpb
      - uses: actions/upload-artifact@v4
        with:
          name: open-rhino-mcp-mcpb
          path: server/out/open-rhino-mcp.mcpb

  server-windows:
    name: MCP server tests (Windows)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm test
